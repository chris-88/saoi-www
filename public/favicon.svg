  <rect width="256" height="256" rx="56" fill="#00736F"/>
  <g transform="translate(58.5,58.5) scale(2.17)" fill="none" stroke="#FFFFFF">
    <path d="M7 32C7 18.1929 18.1929 7 32 7C45.8071 7 57 18.1929 57 32C57 45.8071 45.8071 57 32 57C18.1929 57 7 45.8071 7 32ZM7 32V0" stroke-width="14"/>
    <path d="M22 29H28" stroke-width="6"/>
    <path d="M37 29H43" stroke-width="6"/>
  </g>
</svg>
